name: Build AI Office
on: workflow_dispatch
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - shell: bash
        run: |
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          pyinstaller --onefile --name AIOffice --add-data "index.html${SEP}." --add-data "font.ttf${SEP}." --add-data "voice_workflow_api.json${SEP}." --add-data "video_workflow_api.json${SEP}." --add-data "font.ttf${SEP}." \
            --collect-all imageio_ffmpeg \
            --collect-data googleapiclient --collect-submodules uvicorn main.py
      - uses: actions/upload-artifact@v4
        with:
          name: AIOffice-${{ matrix.os }}
          path: dist/*
